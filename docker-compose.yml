services:
  postgres:
    image: postgres:17-alpine
    container_name: idempotency-key-study-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: idempotency_study
      POSTGRES_USER: idempotency
      POSTGRES_PASSWORD: idempotency
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idempotency -d idempotency_study"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./idempotency-key-study-be
    container_name: idempotency-key-study-be
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: idempotency_study
      DB_USERNAME: idempotency
      DB_PASSWORD: idempotency
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./idempotency-key-study-fe
    container_name: idempotency-key-study-fe
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
